name: Notify main site

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger main site deployment
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_ACCESS_TOKEN__QR_GENERATOR }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lluisalemanypuig/lluisalemanypuig/actions/workflows/deploy-qr-generator.yml/dispatches \
            -d '{"ref":"main"}'
